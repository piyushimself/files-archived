const CATS = ["All","Modern","Historical","Supernatural","Isekai","Dark","RomCom"];
const RTIERS = ["All","9.0+","8.0-8.9","7.0-7.9","Below 7.0"];
let activeCat = "All", activeRating = "All", expanded = null;

function getRatioClass(r){
  if(r>=9) return "r-s";
  if(r>=8) return "r-a";
  if(r>=7) return "r-b";
  return "r-c";
}
function matchesRating(r,tier){
  if(tier==="All") return true;
  if(tier==="9.0+") return r>=9;
  if(tier==="8.0-8.9") return r>=8 && r<9;
  if(tier==="7.0-7.9") return r>=7 && r<8;
  if(tier==="Below 7.0") return r<7;
  return true;
}

function buildFilters(){
  const cf = document.getElementById("catFilters");
  CATS.forEach(c=>{
    const p=document.createElement("span");
    p.className="pill"+(c===activeCat?" active":"");
    p.textContent=c;
    p.onclick=()=>{activeCat=c;renderFilters();renderCards();};
    cf.appendChild(p);
  });
  const rf = document.getElementById("ratingFilters");
  RTIERS.forEach(t=>{
    const p=document.createElement("span");
    p.className="pill"+(t===activeRating?" active":"");
    p.textContent=t;
    p.onclick=()=>{activeRating=t;renderFilters();renderCards();};
    rf.appendChild(p);
  });
}

function renderFilters(){
  document.querySelectorAll("#catFilters .pill").forEach((p,i)=>{p.className="pill"+(CATS[i]===activeCat?" active":"");});
  document.querySelectorAll("#ratingFilters .pill").forEach((p,i)=>{p.className="pill"+(RTIERS[i]===activeRating?" active":"");});
}

function getFiltered(){
  const q = document.getElementById("searchInput").value.toLowerCase().trim();
  const sort = document.getElementById("sortSel").value;
  let items = DATA.filter(d=>{
    if(activeCat!=="All" && d.cat!==activeCat) return false;
    if(!matchesRating(d.rating,activeRating)) return false;
    if(q && !d.title.toLowerCase().includes(q) && !d.desc.toLowerCase().includes(q) && !d.tags.some(t=>t.toLowerCase().includes(q))) return false;
    return true;
  });
  if(sort==="rating-desc") items.sort((a,b)=>b.rating-a.rating);
  else if(sort==="rating-asc") items.sort((a,b)=>a.rating-b.rating);
  else if(sort==="alpha") items.sort((a,b)=>a.title.localeCompare(b.title));
  else items.sort((a,b)=>a.id-b.id);
  return items;
}

function renderCards(){
  const items = getFiltered();
  const grid = document.getElementById("cardsGrid");
  const noR = document.getElementById("noResults");
  const stats = document.getElementById("statsText");
  const avg = document.getElementById("avgRating");

  if(items.length===0){
    grid.innerHTML="";
    noR.style.display="block";
    stats.textContent="0 titles found";
    avg.textContent="";
    return;
  }
  noR.style.display="none";
  const avgVal = (items.reduce((s,d)=>s+d.rating,0)/items.length).toFixed(1);
  stats.textContent=`${items.length} of ${DATA.length} titles shown`;
  avg.textContent=`Avg rating: ${avgVal}`;

  grid.innerHTML = items.map(d=>{
    const isExp = expanded===d.id;
    const rc = getRatioClass(d.rating);
    return `<div class="card${isExp?" expanded":""}" onclick="toggleCard(${d.id})">
      <div class="card-header">
        <span class="card-title">${d.title}</span>
        <span class="card-num">#${d.id}</span>
        <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
      </div>
      <div class="card-meta">
        <span class="rating ${rc}">⭐ ${d.rating}/10</span>
        <span class="cat-badge">${d.cat}</span>
      </div>
      <div class="expand-body">
        <p>${d.desc}</p>
        <div class="expand-detail">${d.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
        <p class="platform-row"><i class="ti ti-device-mobile" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>Platform: <strong>${d.platform}</strong></p>
      </div>
    </div>`;
  }).join("");
}

function toggleCard(id){
  expanded = expanded===id ? null : id;
  renderCards();
}

buildFilters();
renderCards();
</script>
