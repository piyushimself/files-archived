name: Rebuild Reading Room and convert source documents

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.pdf'
      - '**/*.docx'
      - 'tools/convert_documents.py'
      - 'tools/build_site.py'
      - 'tools/audit_site.py'
      - 'tools/repair_visible_escapes.py'
      - 'tools/bump_asset_versions.py'
      - 'tools/test_reading_room.cjs'
      - 'README.md'
      - '*.html'
      - 'html/**'
      - 'collections/**'
      - 'assets/**'
      - '.github/workflows/convert-documents.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: reading-room-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr
          python -m pip install --upgrade pip
          python -m pip install python-docx

      - name: Validate Python build scripts
        run: |
          python -m py_compile tools/convert_documents.py tools/build_site.py tools/audit_site.py tools/repair_visible_escapes.py tools/bump_asset_versions.py
          node --check assets/reading-room.js
          node --check tools/test_reading_room.cjs
          rm -rf tools/__pycache__

      - name: Install DOM smoke-test dependency
        run: npm install --prefix /tmp/rr-test jsdom@26 --no-audit --no-fund

      - name: Convert every source PDF and DOCX
        run: python tools/convert_documents.py

      - name: Build the themed multi-page Reading Room
        run: python tools/build_site.py

      - name: Refresh shared asset versions across every HTML page
        run: python tools/bump_asset_versions.py

      - name: Repair visible escaped line breaks across every HTML page
        run: python tools/repair_visible_escapes.py

      - name: Audit every HTML page
        run: python tools/audit_site.py

      - name: Exercise catalogue and reader controls in a DOM
        run: NODE_PATH=/tmp/rr-test/node_modules node tools/test_reading_room.cjs

      - name: Verify source coverage and generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('.')
          sources = list(root.glob('*.pdf')) + list(root.glob('*.docx'))
          report = json.loads((root/'html/conversion-report.json').read_text())
          assert len(sources) == 46, f'Expected 46 source documents, found {len(sources)}'
          assert report['source_count'] == len(sources), (report['source_count'], len(sources))
          assert report['reader_count'] == len(sources), (report['reader_count'], len(sources))
          missing = [x['output'] for x in report['sources'] if not (root/x['output']).exists()]
          assert not missing, f'Missing generated readers: {missing}'
          assert (root/'index.html').exists()
          assert len(list((root/'collections').glob('*.html'))) == 8
          assert (root/'html/index.html').exists()
          archive = (root/'html/index.html').read_text(encoding='utf-8')
          assert 'archive-category' in archive, 'Archive must use compact subject selector'
          assert 'rr-archive-chip' not in archive, 'Legacy oversized category chips remain'
          html_pages = list(root.glob('*.html')) + list((root/'html').glob('*.html')) + list((root/'collections').glob('*.html'))
          for page in html_pages:
              body = page.read_text(encoding='utf-8', errors='replace')
              if page.name == 'index.html' and page.parent == root:
                  assert 'rr-home-hero' in body, 'Homepage not rebuilt'
              else:
                  assert 'reading-room.css?v=17' in body, f'Missing shared stylesheet: {page}'
              assert 'class=\"rr-page' in body, f'Missing Reading Room page scope: {page}'
              assert body.count('reading-room.js?v=17') == 1, f'Duplicate or missing shared script: {page}'
          for item in report['sources']:
              if item['status'] != 'converted':
                  continue
              reader = (root/item['output']).read_text(encoding='utf-8', errors='replace')
              assert 'id="search"' in reader, f'Missing within-document search: {item["output"]}'
              if item.get('toc_entries', 0) == 0:
                  assert 'rr-no-toc' in reader, f'Missing wide layout for no-TOC reader: {item["output"]}'
              assert '../' + item['source'] in reader, f'Missing original source link: {item["output"]}'
              assert 'rr-reader-summary' in reader, f'Missing source-led context: {item["output"]}'
          audit = json.loads((root/'html/page-audit.json').read_text())
          assert audit['page_count'] == len(html_pages), (audit['page_count'], len(html_pages))
          assert audit['hard_error_count'] == 0, audit['hard_errors']
          poetry = (root/'html/Aag_Ki_Kavitayen.html').read_text(encoding='utf-8')
          poem_cards = re.findall(r'<article class="poem-card" id="([^"]+)"', poetry)
          poem_ids = [item for item in poem_cards]
          assert len(poem_ids) == 100, f'Aag Ki Kavitayen should render 100 distinct poem entries, found {len(poem_ids)}'
          assert len(set(poem_ids)) == 100, 'Aag Ki Kavitayen contains duplicate poem anchors'
          assert len(re.findall(r'<section class="page poetry-volume-group"', poetry)) == 5, 'Aag Ki Kavitayen should retain its five-part structure'
          assert poetry.count('class="poetry-line"') >= 100, 'Poetry verse lineation is missing or incomplete'
          assert 'Sabse Khatarnak' in poetry and 'Open original PDF' in poetry, 'Poetry title or original source link is missing'
          assert 'data-poet=' in poetry and 'poetry-stanza' in poetry, 'Poet attribution or stanza structure is missing'
          filmography = (root/'html/300_Films_Filmography.html').read_text(encoding='utf-8')
          assert 'rr-reader-tools' in filmography and 'id="search"' in filmography
          assert 'buildFilmCatalogue' in (root/'assets/reading-room.js').read_text(encoding='utf-8')
          print(f'PASS: {len(sources)} sources; {report["reader_count"]} reading editions; {len(list((root/"collections").glob("*.html")))} subject pages; {len(html_pages)} HTML files audited.')
          print('Extraction statuses:', {s: sum(1 for x in report['sources'] if x['status']==s) for s in sorted({x['status'] for x in report['sources']})})
          PY

      - name: Commit rebuilt site
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.html' 'html/' 'collections/' 'assets/' 'tools/convert_documents.py' 'tools/build_site.py' 'tools/audit_site.py' 'tools/test_reading_room.cjs' 'tools/repair_visible_escapes.py' 'tools/bump_asset_versions.py' '.github/workflows/convert-documents.yml' 'README.md'
            git commit -m "Rebuild Reading Room from all source documents"
            git pull --rebase origin main
            git push origin main
          else
            echo "No generated changes."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble the verified Reading Room
        run: |
          mkdir -p _site/html _site/collections _site/assets
          cp ./*.html _site/
          cp -R assets/. _site/assets/
          cp -R html/. _site/html/
          cp -R collections/. _site/collections/
          touch _site/.nojekyll

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ github.run_attempt }}

      - name: Deploy the verified Reading Room
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ github.run_attempt }}
