// Deduplicate by title
const seen = new Set();
const DATA = [];
for (const r of ALL) {
  const key = r[0].toLowerCase().trim();
  if (!seen.has(key)) { seen.add(key); DATA.push(r); }
}

let sortCol = 1, sortDir = 1;
const PAGE = 25;
let page = 0;
let filtered = [];

function getDecade(y) {
  const n = parseInt(y);
  if (n < 1940) return 'Pre-1940s';
  if (n < 1950) return '1940s';
  if (n < 1960) return '1950s';
  if (n < 1970) return '1960s';
  if (n < 1980) return '1970s';
  if (n < 1990) return '1980s';
  if (n < 2000) return '1990s';
  if (n < 2010) return '2000s';
  if (n < 2020) return '2010s';
  return '2020s';
}

function rc(r) {
  return { G:'r-G', PG:'r-PG', 'PG-13':'r-PG13', R:'r-R', NR:'r-NR', X:'r-X' }[r] || 'r-NR';
}

function filterData() {
  const q  = document.getElementById('search').value.toLowerCase();
  const rg = document.getElementById('filterRegion').value.toLowerCase();
  const rt = document.getElementById('filterRating').value;
  const gn = document.getElementById('filterGenre').value;
  const dc = document.getElementById('filterDecade').value;
  const st = document.getElementById('filterStyle').value;

  filtered = DATA.filter(r => {
    const [title,year,country,genre,style,rating,note] = r;
    if (q  && ![title,year,country,genre,style,rating,note||''].some(v=>v.toLowerCase().includes(q))) return false;
    if (rg && !country.toLowerCase().includes(rg)) return false;
    if (rt && rating !== rt) return false;
    if (gn && genre !== gn) return false;
    if (dc && getDecade(year) !== dc) return false;
    if (st && style !== st) return false;
    return true;
  });

  filtered.sort((a,b) => {
    const av = sortCol===2 ? parseInt(a[2]) : (a[sortCol]||'');
    const bv = sortCol===2 ? parseInt(b[2]) : (b[sortCol]||'');
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  page = 0;
  render();
}

function sortBy(c) {
  if (sortCol===c) sortDir*=-1; else { sortCol=c; sortDir=1; }
  [1,2,3,4,5,6].forEach(i => {
    const el = document.getElementById('th'+i);
    if (!el) return;
    el.classList.toggle('sort-active', i===c);
    const sp = el.querySelector('span');
    if (sp) sp.textContent = (i===c) ? (sortDir===1?'↑':'↓') : '↕';
  });
  filterData();
}

function render() {
  const start = page * PAGE;
  const slice = filtered.slice(start, start+PAGE);
  document.getElementById('tbody').innerHTML = slice.map((r,i) => {
    const [title,year,country,genre,style,rating,note] = r;
    return `<tr>
      <td class="num">${start+i+1}</td>
      <td class="title-cell">${title}</td>
      <td class="year-cell">${year}</td>
      <td class="country-cell">${country}</td>
      <td class="genre-cell">${genre}</td>
      <td class="style-cell">${style}</td>
      <td><span class="badge ${rc(rating)}">${rating}</span></td>
      <td class="note-cell">${note||''}</td>
    </tr>`;
  }).join('');

  const total = filtered.length;
  document.getElementById('hcount').textContent = DATA.length;
  document.getElementById('stats').textContent =
    `${total} film${total!==1?'s':''} — showing ${Math.min(start+1,total)}–${Math.min(start+PAGE,total)}`;

  const totalPages = Math.ceil(total/PAGE);
  document.getElementById('pager').innerHTML =
    `<button onclick="goPage(${page-1})" ${page===0?'disabled':''}>← Prev</button>
     <span class="pi">${page+1} / ${totalPages}</span>
     <button onclick="goPage(${page+1})" ${page>=totalPages-1?'disabled':''}>Next →</button>`;
}

function goPage(p) {
  const tp = Math.ceil(filtered.length/PAGE);
  page = Math.max(0, Math.min(p, tp-1));
  render();
  window.scrollTo(0,0);
}

['search','filterRegion','filterRating','filterGenre','filterDecade','filterStyle']
  .forEach(id => document.getElementById(id).addEventListener('input', filterData));

filterData();
</script>
