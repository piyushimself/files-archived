<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Typewriter</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f4ec;
    --ink: #2b2b28;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ddd8cc;
    font-family: 'Courier Prime', 'Special Elite', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 30px 16px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  select, button {
    font-family: 'Courier Prime', monospace;
    font-size: 13px;
    padding: 8px 14px;
    border: 1px solid #999;
    background: #fff;
    color: #333;
    cursor: pointer;
    border-radius: 3px;
  }
  button:hover, select:hover { background: #eee; }
  .page {
    width: 8.5in;
    min-height: 11in;
    background: var(--paper);
    box-shadow: 0 4px 18px rgba(0,0,0,0.25);
    padding: 1in;
  }
  textarea {
    width: 100%;
    height: 100%;
    min-height: 9in;
    border: none;
    background: transparent;
    resize: none;
    outline: none;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.9;
    letter-spacing: 0.5px;
  }
  .font-elite { font-family: 'Special Elite', monospace; }
  .font-courier { font-family: 'Courier Prime', monospace; }

  @media print {
    body { background: white; padding: 0; }
    .toolbar { display: none; }
    .page { box-shadow: none; width: auto; min-height: auto; padding: 0.75in; }
    textarea { min-height: auto; }
  }
</style>

<link rel="stylesheet" href="assets/reading-room.css?v=17"><script src="assets/reading-room-context.js?v=17" defer></script><script src="assets/reading-room.js?v=17" defer></script></head>
<body class="rr-page rr--art">
<h1 class="rr-sr-only">Typewriter Studio</h1>
<nav class="rr-contextbar"><a href="index.html">← THE READING ROOM</a><span><em>Typewriter Studio</em> · A distraction-light writing surface with print-friendly output</span></nav>

<div class="toolbar">
  <select id="fontSelect" onchange="changeFont()">
    <option value="font-courier">Courier Prime</option>
    <option value="font-elite">Special Elite (classic typewriter)</option>
  </select>
  <button onclick="window.print()">🖨 Print</button>
</div>

<div class="page">
  <textarea id="editor" class="font-courier" placeholder="Start typing..." autofocus></textarea>
</div>

<script>
  function changeFont() {
    const editor = document.getElementById('editor');
    const val = document.getElementById('fontSelect').value;
    editor.classList.remove('font-courier', 'font-elite');
    editor.classList.add(val);
  }
</script>

</body>
</html>
